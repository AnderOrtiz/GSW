services:
  minio-cloud-simulado:
    image: cgr.dev/chainguard/minio:latest
    container_name: minio_s3_emulator
    environment:
      MINIO_ROOT_USER: "admin_cloud"
      MINIO_ROOT_PASSWORD: "Password123!"
    ports:
      - "9005:9000"   # Se cambia el puerto expuesto en el host a 9005
      - "9001:9001"   # Puerto del Panel Web (Console)
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

volumes:
  minio_data: