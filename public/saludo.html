# HTML galáctico — Saludo

```html
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universo | Hola Mundo</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            color: white;
            background:
                radial-gradient(circle at 20% 30%, rgba(91, 44, 180, .25), transparent 25%),
                radial-gradient(circle at 80% 70%, rgba(0, 180, 255, .18), transparent 25%),
                radial-gradient(circle at center, #151047 0%, #08051c 45%, #02030c 100%);
            position: relative;
        }

        /* ===== ESTRELLAS ===== */

        .stars,
        .stars::before,
        .stars::after {
            position: absolute;
            inset: 0;
            content: "";
            background-image:
                radial-gradient(2px 2px at 20px 30px, white, transparent),
                radial-gradient(1px 1px at 80px 90px, white, transparent),
                radial-gradient(2px 2px at 140px 40px, #8ed8ff, transparent),
                radial-gradient(1px 1px at 220px 160px, white, transparent),
                radial-gradient(2px 2px at 300px 70px, #d9bfff, transparent),
                radial-gradient(1px 1px at 370px 190px, white, transparent),
                radial-gradient(2px 2px at 450px 120px, #8ed8ff, transparent),
                radial-gradient(1px 1px at 520px 230px, white, transparent);
            background-size: 600px 300px;
        }

        .stars {
            animation: moveStars 80s linear infinite;
            opacity: .8;
        }

        .stars::before {
            transform: scale(1.5);
            opacity: .45;
            animation: moveStars 120s linear infinite reverse;
        }

        .stars::after {
            transform: scale(2);
            opacity: .25;
            animation: moveStars 160s linear infinite;
        }

        @keyframes moveStars {
            from {
                transform: translateY(0);
            }

            to {
                transform: translateY(-300px);
            }
        }

        /* ===== NEBULOSAS ===== */

        .nebula {
            position: absolute;
            width: 650px;
            height: 650px;
            border-radius: 50%;
            filter: blur(80px);
            opacity: .18;
            pointer-events: none;
        }

        .nebula.one {
            background: #8a2be2;
            top: -300px;
            left: -200px;
            animation: float1 12s ease-in-out infinite alternate;
        }

        .nebula.two {
            background: #00bfff;
            right: -250px;
            bottom: -300px;
            animation: float2 15s ease-in-out infinite alternate;
        }

        @keyframes float1 {
            to {
                transform: translate(100px, 80px) scale(1.15);
            }
        }

        @keyframes float2 {
            to {
                transform: translate(-100px, -80px) scale(1.2);
            }
        }

        /* ===== CONTENEDOR ===== */

        .container {
            position: relative;
            z-index: 5;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px;
        }

        /* ===== TARJETA ===== */

        .card {
            position: relative;
            width: min(850px, 95vw);
            padding: 70px 50px;
            text-align: center;

            background: rgba(255, 255, 255, .055);
            border: 1px solid rgba(255, 255, 255, .15);
            border-radius: 30px;

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            box-shadow:
                0 0 80px rgba(80, 60, 255, .15),
                inset 0 0 40px rgba(255, 255, 255, .025);

            overflow: hidden;

            animation: cardAppear 1.5s ease forwards;
        }

        .card::before {
            content: "";
            position: absolute;
            width: 250px;
            height: 250px;
            background: #6f42ff;
            filter: blur(100px);
            opacity: .15;
            top: -150px;
            left: -100px;
        }

        .card::after {
            content: "";
            position: absolute;
            width: 250px;
            height: 250px;
            background: #00c8ff;
            filter: blur(100px);
            opacity: .12;
            right: -120px;
            bottom: -150px;
        }

        @keyframes cardAppear {
            from {
                opacity: 0;
                transform: translateY(40px) scale(.96);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* ===== PLANETA ===== */

        .planet {
            position: relative;
            width: 115px;
            height: 115px;
            margin: 0 auto 35px;
            border-radius: 50%;

            background:
                radial-gradient(circle at 30% 25%,
                    #b9f5ff 0%,
                    #42b8ff 25%,
                    #2638c9 55%,
                    #0b0630 100%);

            box-shadow:
                inset -20px -15px 35px rgba(0, 0, 0, .7),
                0 0 25px rgba(69, 190, 255, .7),
                0 0 80px rgba(77, 68, 255, .35);

            animation: planetFloat 5s ease-in-out infinite;
        }

        .planet::before {
            content: "";
            position: absolute;
            width: 155px;
            height: 35px;
            left: -20px;
            top: 42px;
            border: 2px solid rgba(110, 220, 255, .5);
            border-radius: 50%;
            transform: rotate(-18deg);
            box-shadow: 0 0 15px rgba(0, 200, 255, .5);
        }

        .planet::after {
            content: "";
            position: absolute;
            inset: 12px;
            border-radius: 50%;
            background:
                radial-gradient(circle at 65% 35%, rgba(255, 255, 255, .3), transparent 8%),
                radial-gradient(circle at 35% 65%, rgba(255, 255, 255, .15), transparent 12%);
        }

        @keyframes planetFloat {

            0%,
            100% {
                transform: translateY(0) rotate(-3deg);
            }

            50% {
                transform: translateY(-12px) rotate(3deg);
            }
        }

        /* ===== TEXTO ===== */

        .subtitle {
            color: #8ddcff;
            font-size: .8rem;
            letter-spacing: 6px;
            text-transform: uppercase;
            margin-bottom: 15px;
            opacity: .8;
        }

        h1 {
            font-size: clamp(3.5rem, 10vw, 7rem);
            line-height: .95;
            font-weight: 800;
            letter-spacing: -5px;

            background: linear-gradient(90deg,
                    #ffffff,
                    #8bdcff,
                    #b892ff,
                    #ffffff);

            background-size: 300%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;

            animation: gradientText 6s ease infinite;
        }

        @keyframes gradientText {

            0%,
            100% {
                background-position: 0%;
            }

            50% {
                background-position: 100%;
            }
        }

        p {
            max-width: 600px;
            margin: 25px auto 35px;
            color: rgba(255, 255, 255, .65);
            font-size: 1.1rem;
            line-height: 1.8;
        }

        /* ===== BOTÓN ===== */

        .button {
            display: inline-block;
            padding: 15px 30px;
            border-radius: 50px;

            color: white;
            text-decoration: none;
            font-weight: bold;
            letter-spacing: 1px;

            background: linear-gradient(135deg,
                    #693cff,
                    #00bfff);

            box-shadow:
                0 10px 35px rgba(70, 90, 255, .35);

            transition: .3s ease;
        }

        .button:hover {
            transform: translateY(-4px) scale(1.03);
            box-shadow:
                0 15px 45px rgba(0, 190, 255, .45);
        }

        /* ===== PEQUEÑOS DETALLES ===== */

        .coordinates {
            position: absolute;
            bottom: 22px;
            left: 30px;
            font-size: .65rem;
            letter-spacing: 2px;
            color: rgba(255, 255, 255, .3);
        }

        .status {
            position: absolute;
            bottom: 22px;
            right: 30px;
            font-size: .65rem;
            letter-spacing: 2px;
            color: rgba(130, 255, 200, .55);
        }

        .status::before {
            content: "";
            display: inline-block;
            width: 7px;
            height: 7px;
            margin-right: 7px;
            border-radius: 50%;
            background: #55ffb0;
            box-shadow: 0 0 10px #55ffb0;
        }

        /* ===== MÓVIL ===== */

        @media (max-width: 600px) {
            .card {
                padding: 55px 25px;
                border-radius: 24px;
            }

            .planet {
                width: 90px;
                height: 90px;
                margin-bottom: 25px;
            }

            .planet::before {
                width: 125px;
                left: -18px;
                top: 32px;
            }

            h1 {
                letter-spacing: -3px;
            }

            p {
                font-size: .95rem;
            }

            .coordinates,
            .status {
                display: none;
            }
        }
    </style>
</head>

<body>

    <div class="stars"></div>

    <div class="nebula one"></div>
    <div class="nebula two"></div>

    <main class="container">

        <section class="card">

            <div class="planet"></div>

            <div class="subtitle">
                Señal recibida · Sistema Solar
            </div>

            <h1>Hola Mundo</h1>

            <p>
                Has llegado a un pequeño rincón del universo.
                Este archivo HTML está funcionando correctamente
                y tu servidor acaba de establecer conexión.
            </p>

            </a> -->

        </section>

    </main>

    <div class="coordinates">
        SECTOR · 07.23.∞
    </div>

    <div class="status">
        SISTEMA ONLINE
    </div>

</body>

</html>
```
