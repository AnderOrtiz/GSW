# Sitio 2 Independiente
<VirtualHost *:80>
    ServerName sitio2.local
    DocumentRoot /usr/local/apache2/htdocs/sitio2.local

    <Directory /usr/local/apache2/htdocs/sitio2.local>
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog /usr/local/apache2/logs/sitio2_error.log
    CustomLog /usr/local/apache2/logs/sitio2_access.log combined
</VirtualHost>

# Proxy Inverso hacia Backend Express (mi-api.local)
<VirtualHost *:80>
    ServerName mi-api.local

    ProxyPreserveHost On
    ProxyPass / http://host.docker.internal:3000/
    ProxyPassReverse / http://host.docker.internal:3000/

    ErrorLog /usr/local/apache2/logs/api_error.log
    CustomLog /usr/local/apache2/logs/api_access.log combined
</VirtualHost>